<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>飞书文档转换器</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 420px;
      min-height: 320px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f5f5f5;
      color: #333;
    }
    .header {
      background: linear-gradient(135deg, #6B8CFF 0%, #4A6CF7 100%);
      color: white;
      padding: 14px 16px;
      text-align: center;
    }
    .header h1 { font-size: 16px; font-weight: 600; margin-bottom: 2px; }
    .header p { font-size: 12px; opacity: 0.85; }
    .content { padding: 12px; }
    .info-box {
      background: white; border-radius: 8px; padding: 10px 12px;
      margin-bottom: 10px; font-size: 13px; line-height: 1.5;
    }
    .info-box .label { color: #888; font-size: 12px; margin-bottom: 2px; }
    .info-box .value { color: #333; font-weight: 500; word-break: break-all; }
    .btn {
      width: 100%; padding: 10px; border: none; border-radius: 8px;
      font-size: 13px; font-weight: 500; cursor: pointer;
      transition: all 0.2s; margin-bottom: 6px;
    }
    .btn-row { display: flex; gap: 6px; }
    .btn-row .btn { flex: 1; }
    .btn-primary {
      background: linear-gradient(135deg, #6B8CFF 0%, #4A6CF7 100%);
      color: white;
    }
    .btn-primary:hover { background: linear-gradient(135deg, #5A7BEE 0%, #395BE6 100%); }
    .btn-primary:disabled { background: #ccc; cursor: not-allowed; }
    .btn-secondary { background: white; color: #4A6CF7; border: 1px solid #4A6CF7; }
    .btn-secondary:hover { background: #f0f4ff; }
    .btn-success { background: #4CAF50; color: white; }
    .btn-success:hover { background: #43A047; }

    .status {
      margin-top: 8px; padding: 8px 10px; border-radius: 8px;
      font-size: 12px; line-height: 1.5; display: none;
    }
    .status.show { display: block; }
    .status.success { background: #E8F5E9; color: #2E7D32; border: 1px solid #C8E6C9; }
    .status.error { background: #FFEBEE; color: #C62828; border: 1px solid #FFCDD2; }
    .status.loading { background: #E3F2FD; color: #1565C0; border: 1px solid #BBDEFB; }

    .progress-wrap { margin-top: 8px; display: none; }
    .progress-wrap.show { display: block; }
    .progress-bar {
      width: 100%; height: 4px; background: #E0E0E0;
      border-radius: 2px; overflow: hidden;
    }
    .progress-fill {
      height: 100%; background: linear-gradient(90deg, #6B8CFF, #4CAF50);
      width: 0%; transition: width 0.3s;
    }

    .options {
      background: white; border-radius: 8px; padding: 10px 12px;
      margin-bottom: 10px;
    }
    .options label {
      display: flex; align-items: center; font-size: 13px;
      margin-bottom: 6px; cursor: pointer;
    }
    .options label:last-child { margin-bottom: 0; }
    .options input[type="checkbox"] { margin-right: 8px; }

    .stats {
      display: flex; justify-content: space-between; margin-top: 6px;
      font-size: 12px; color: #666;
    }

    .preview {
      background: white; border-radius: 8px; padding: 10px; margin-top: 8px;
      max-height: 180px; overflow-y: auto; display: none;
      font-family: "SF Mono", "Fira Code", Consolas, monospace;
      font-size: 11px; line-height: 1.5; white-space: pre-wrap;
      color: #333; border: 1px solid #E0E0E0;
    }
    .preview.show { display: block; }
    .preview::-webkit-scrollbar { width: 4px; }
    .preview::-webkit-scrollbar-thumb { background: #ccc; border-radius: 2px; }
  </style>
</head>
<body>
  <div class="header">
    <h1>📄 飞书文档转换器</h1>
    <p>一键转换为 Markdown</p>
  </div>

  <div class="content">
    <div class="info-box" id="docInfo">
      <div class="label">当前文档</div>
      <div class="value" id="docTitle">🔄 检测中...</div>
    </div>

    <div class="options">
      <label><input type="checkbox" id="optTables" checked> 保留表格</label>
      <label><input type="checkbox" id="optImages" checked> 图片链接</label>
      <label><input type="checkbox" id="optLinks" checked> 保留链接</label>
      <label><input type="checkbox" id="optDebug"> 调试模式</label>
    </div>

    <div class="btn-row">
      <button class="btn btn-primary" id="btnConvert" disabled>🔄 开始转换</button>
      <button class="btn btn-success" id="btnDownload" disabled>💾 下载</button>
    </div>
    <div class="btn-row">
      <button class="btn btn-secondary" id="btnCopy" disabled>📋 复制</button>
      <button class="btn btn-secondary" id="btnPreview">👁 预览</button>
    </div>

    <div class="status" id="status"></div>

    <div class="progress-wrap" id="progressWrap">
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <div class="stats" id="stats"></div>
    </div>

    <div class="preview" id="preview"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
